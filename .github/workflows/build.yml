name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Create .env for Prisma
        run: echo "DATABASE_URL=postgresql://localhost:5432/hmlogistik" > .env

      - run: yarn install --frozen-lockfile

      - run: yarn build
