name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H '${{ secrets.HOST }}' >> ~/.ssh/known_hosts

      - name: Show SSH key fingerprint
        run: ssh-keygen -lf ~/.ssh/deploy_key

      - name: Test SSH connection
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@${{ secrets.HOST }} 'hostname'

      - name: Deploy to DigitalOcean
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@${{ secrets.HOST }} <<'EOF'
          set -euo pipefail
          cd /opt/hmlogistik
          git pull --ff-only origin master
          bash deploy.sh
          docker image prune -f
          EOF
