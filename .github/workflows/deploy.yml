name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_ed25519
          known_hosts: placeholder
          if_key_exists: replace

      - name: Configure known_hosts
        run: ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Show SSH key fingerprint
        run: ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Verify SSH key fingerprint
        run: |
          test "$(ssh-keygen -lf ~/.ssh/id_ed25519 | awk '{print $2}')" = "SHA256:ahAVbt9vuOInbbHCh1v4py2ioqAhx5mi7/HgvOQmLW8"

      - name: Test SSH connection
        run: ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes root@${{ secrets.HOST }} 'hostname'

      - name: Deploy to DigitalOcean
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes root@${{ secrets.HOST }} <<'EOF'
          set -euo pipefail
          cd /opt/hmlogistik
          git pull --ff-only origin master
          bash deploy.sh
          docker image prune -f
          EOF
